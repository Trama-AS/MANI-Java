# =====================================================================
# Configuración de SonarQube para MANI-Java (Rules Service)
# Referencia: ADR-0005 (SAST en CI/CD con SonarQube), QA4-02 (SCRUM-1265)
# Servidor: SonarQube Community de la VM de Calidad (self-hosted, no SonarCloud)
# =====================================================================

# Identificación del proyecto. En pull requests el workflow quality-gate.yml
# sobrescribe la clave con mani-java-pr (Community no analiza ramas ni PRs).
sonar.projectKey=mani-java
sonar.projectName=MANI-Java

sonar.sourceEncoding=UTF-8
sonar.java.source=17

# Rutas de código fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java

# Bytecode y dependencias compilados por el job "Pruebas y cobertura" en
# ubuntu-latest y descargados como artefacto: el runner de la VM no ejecuta Maven.
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar

# Reporte de cobertura generado por "mvn verify" (jacoco-maven-plugin)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/ManiRulesApplication.java
