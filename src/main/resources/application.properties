server.port=8080
spring.application.name=mani-rules-java

# Formato de logging estructurado
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [Correlation: %X{X-Correlation-ID}] %msg%n

# Reglas de categoria de servicio (US-03.1.1-M6). Mismos valores que crear_categoria_servicio()
# (migracion 003). Cambiarlas aqui (o por SPRING_APPLICATION_JSON / config montada) solo exige
# redesplegar Rules; sube la version para que cada decision quede trazable.
mani.rules.category.defaults.version=category-rules-v1
mani.rules.category.defaults.name-min-length=3
mani.rules.category.defaults.name-max-length=60
mani.rules.category.defaults.name-requires-letter=true
mani.rules.category.defaults.allowed-flujos=COTIZACION_PREVIA,TARIFA_ESTANDAR
# Override por tenant (hereda lo no declarado). Ejemplo:
# mani.rules.category.tenants[10000000-0000-4000-8000-000000000011].version=category-rules-v1-t11
# mani.rules.category.tenants[10000000-0000-4000-8000-000000000011].name-max-length=80
# Ojo: un flujo NUEVO tambien exige ampliar el CHECK ck_categoria_flujo de la BD.

# Evaluacion de importes contra la tarifa de referencia (SCRUM-887 / SCRUM-1462). La tarifa la persiste Core y llega
# en cada peticion; aqui solo vive la politica. Sube la version al cambiar la tolerancia.
mani.rules.rates.version=rates-v1
mani.rules.rates.tolerance-percent=0
